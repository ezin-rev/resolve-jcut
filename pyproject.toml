[project]
name = "autocut"
version = "0.1.0"
description = "AutoCut-style auto-editor for DaVinci Resolve (free version supported)"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
docs = ["mkdocs-material>=9.5"]

[tool.uv]
